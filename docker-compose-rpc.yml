version: "3.8"

volumes:
  ckan_storage:
  pg_data:
  solr_data:
  minio_data:

services:

  ckan-dev:
    container_name: ckan-sse-dev
    build:
      context: ckan/
      dockerfile: Dockerfile.dev
      args:
        - TZ=${TZ:-UTC}
    env_file:
      - .env
    depends_on:
      solr:
        condition: service_healthy
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    ports:
      - "0.0.0.0:${CKAN_PORT_HOST:-5000}:${CKAN_PORT:-5000}"
      - "0.0.0.0:50051:50051"  # gRPC RPC Service
    volumes:
      - ckan_storage:/var/lib/ckan
      - ./src:/srv/app/src_extensions
      - ./ckan:/srv/app/src/ckan
    restart: always
    environment:
      # RPC Service Configuration
      CKAN_RPC_ENABLED: "true"
      CKAN_RPC_HOST: "0.0.0.0"
      CKAN_RPC_PORT: "50051"
      CKAN_RPC_MAX_WORKERS: "10"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://ckan-dev:${CKAN_PORT:-5000}"]
      interval: 30s
      timeout: 30s
      retries: 3

  redis:
    container_name: ckan-tdc-redis
    image: redis:${REDIS_VERSION:-7-alpine}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-e", "QUIT"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    container_name: ckan-sse-db
    build:
      context: postgresql/
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ckan}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ckan}
      - POSTGRES_DB=${POSTGRES_DB:-ckan}
      - CKAN_DB_USER=${CKAN_DB_USER:-ckan}
      - CKAN_DB_PASSWORD=${CKAN_DB_PASSWORD:-ckan}
      - CKAN_DB=${CKAN_DB:-ckan}
      - DATASTORE_READONLY_USER=${DATASTORE_READONLY_USER:-datastore_readonly}
      - DATASTORE_READONLY_PASSWORD=${DATASTORE_READONLY_PASSWORD:-datastore_readonly}
      - DATASTORE_DB=${DATASTORE_DB:-datastore}
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-ckan}", "-d", "${POSTGRES_DB:-ckan}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "0.0.0.0:5432:5432"

  solr:
    container_name: ckan-sse-solr
    image: ckan/ckan-solr:${SOLR_IMAGE_VERSION:-2.10-solr9}
    volumes:
      - solr_data:/var/solr
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8983/solr/"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "8983:8983"

  minio:
    container_name: minio-tdc
    image: minio/minio:latest
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "39323:39323"
    command: server --console-address ":39323" /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Optional: RPC Test Client Service
  rpc-test:
    image: python:3.10-alpine
    working_dir: /app
    volumes:
      - ./ckan/tests/rpc:/app/tests:ro
      - ./ckan:/app/ckan:ro
    environment:
      CKAN_RPC_HOST: ckan-dev
      CKAN_RPC_PORT: "50051"
    depends_on:
      ckan-dev:
        condition: service_healthy
    command: >
      sh -c "
        pip install grpcio==1.68.0 grpcio-tools==1.68.0 protobuf==5.27.2 pytest &&
        echo 'RPC Test Service Ready - Run tests with: docker exec <container_id> pytest /app/tests/' &&
        tail -f /dev/null
      "
    restart: unless-stopped

networks:
  default:
    name: ckan-rpc-network
