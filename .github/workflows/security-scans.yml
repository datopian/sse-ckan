name: Security scans

# Opengrep (static analysis of the CKAN code) over the branch the SSE image is
# built from, uploaded to DefectDojo, where the SSE issue sync turns findings
# into board issues.
#
# No Trivy dependency scan on purpose: requirements.txt here is only the
# starting point. The image build overrides pins (constraints, upgrades), so a
# scan of this file reports packages that are already fixed in the shipped
# image. The image scans in dx-helm-sse-dev and dx-helm-sse-prod report what
# actually ships.
#
# Why this file lives on main but scans another branch: scheduled and manual
# runs only work from the default branch (main), while the deployed code is on
# the ckan-<version> branch (main is behind it). The scanner script is taken
# from main, the code to scan from SCAN_REF. Bump SCAN_REF when the image moves
# to a new CKAN version (CKAN_VERSION in datopian/sse-ckan-docker-image).
#
# Pull requests only scan and print a summary. Weekly and manual runs also
# upload.
#
# Needs: secret DEFECTDOJO_TOKEN (DefectDojo API v2 key) and repo variables
# DEFECTDOJO_URL (base URL, no trailing slash) and DD_PRODUCT_TYPE (the
# DefectDojo organization the asset lives under).

on:
  pull_request:
    paths:
      - .github/workflows/security-scans.yml
      - ci/**
  schedule:
    # Weekly: new advisories appear against dependencies that did not change.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scans-${{ github.ref }}
  cancel-in-progress: true

env:
  SCAN_REF: ckan-2.10.11

jobs:
  opengrep:
    # GitHub-hosted on purpose: this repo is public, and self-hosted runners
    # must never run code from public pull requests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tools
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SCAN_REF }}
          path: src

      - name: Opengrep scan
        run: |
          # Left out because they are not deployed or never loaded: the Bootstrap 3
          # theme and CKAN's example_* demo plugins (the instance serves the
          # default Bootstrap 5 templates), plus docs, contrib scripts and the
          # Cypress test suite.
          python3 tools/ci/opengrep_scan.py src "$RUNNER_TEMP/sast.json" \
            --exclude public-bs3 --exclude templates-bs3 --exclude 'example_*' \
            --exclude doc --exclude contrib --exclude cypress \
            --semgrep-json "$RUNNER_TEMP/sast-semgrep.json" \
            --markdown "$RUNNER_TEMP/sast.md" | tee -a "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/sast.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to DefectDojo
        if: github.event_name != 'pull_request'
        env:
          DEFECTDOJO_TOKEN: ${{ secrets.DEFECTDOJO_TOKEN }}
          DEFECTDOJO_URL: ${{ vars.DEFECTDOJO_URL }}
          DD_PRODUCT_TYPE: ${{ vars.DD_PRODUCT_TYPE }}
        run: |
          for v in DEFECTDOJO_TOKEN DEFECTDOJO_URL DD_PRODUCT_TYPE; do
            [ -n "${!v}" ] || { echo "::error::$v is not set"; exit 1; }
          done
          # Reimport (not import) so a fixed finding is closed on the next run
          # instead of piling up as a new test every time.
          curl -sS -L --fail-with-body -X POST "$DEFECTDOJO_URL/api/v2/reimport-scan/" \
            -H "Authorization: Token $DEFECTDOJO_TOKEN" \
            -F "scan_type=Semgrep JSON Report" \
            -F "test_title=Opengrep SAST" \
            -F "product_name=${GITHUB_REPOSITORY#*/}" \
            -F "product_type_name=$DD_PRODUCT_TYPE" \
            -F "engagement_name=CI/CD Scans" \
            -F "auto_create_context=true" \
            -F "close_old_findings=true" \
            -F "service=sast" \
            -F "file=@$RUNNER_TEMP/sast-semgrep.json"
